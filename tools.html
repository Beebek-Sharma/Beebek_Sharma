    <script>
      (function () {
        try {
          var pref = localStorage.getItem('beebek-theme') || 'system';
          var isDark = pref === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark';
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme-preference', pref);
        } catch (e) {}
      })();
    </script>
    <title>Private Browser Tools | Beebek Sharma</title>
